services:
  babel:
    image: ghcr.io/spikevn/ftu-babel:latest
    container_name: babel
    restart: unless-stopped
    ports:
      - "8386:8000"
    environment:
      - PORT=8000
      - STASH_DB_PATH=/app/data/stash.db
      - USEARCH_INDEX_PATH=/app/data/stash.usearch
      - MOSS_API_KEY=${MOSS_API_KEY:-}
      - MOSS_EMBEDDING_ENDPOINT=${MOSS_EMBEDDING_ENDPOINT:-}
      - MOSS_RERANKING_ENDPOINT=${MOSS_RERANKING_ENDPOINT:-}
      - FTULABS_API_ENDPOINT=${FTULABS_API_ENDPOINT:-}
      - FTULABS_API_KEY=${FTULABS_API_KEY:-}
      - ZEROENTROPY_API_KEY=${ZEROENTROPY_API_KEY:-}
      - ZEROENTROPY_BASE_URL=${ZEROENTROPY_BASE_URL:-}
      - SEARXNG_URL=http://searxng:8080
    env_file:
      - .env
    volumes:
      # Mount the database and vector index into the writable /app/data directory.
      - ./stash.db:/app/data/stash.db:rw
      - ./stash.usearch:/app/data/stash.usearch:rw
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - searxng

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=043a57e6515fef0938b3d63bdf3cb0bc27546a3b2bca60e4
    volumes:
      - ./searxng:/etc/searxng:rw
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
